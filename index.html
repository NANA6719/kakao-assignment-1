<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jelly Todo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>
<body>
  <div class="app">
    <main class="main-panel">
      <section class="top-area">
        <div class="date-navigator">
          <button id="previousDateButton" class="date-button" type="button">‹</button>
          <span id="selectedDateText" class="selected-date">2026-05-31</span>
          <button id="nextDateButton" class="date-button" type="button">›</button>
        </div>

        <form id="todoForm" class="todo-form">
          <input
            id="todoInput"
            class="todo-input"
            type="text"
            placeholder="Add Item"
            autocomplete="off"
          />
          <button class="add-button" type="submit">+</button>
        </form>

        <p id="messageText" class="message-text"></p>
      </section>

      <section id="todoList" class="todo-list"></section>
    </main>

    <aside class="side-panel">
      <div class="filter-area">
        <button class="filter-button active" data-filter="all" type="button">ALL</button>
        <button class="filter-button" data-filter="ing" type="button">ING</button>
        <button class="filter-button" data-filter="clear" type="button">CLEAR</button>
      </div>

      <div class="week-header">
        <button id="previousWeekButton" type="button">‹</button>
        <span id="weekRangeText"></span>
        <button id="nextWeekButton" type="button">›</button>
      </div>

      <div id="weekView" class="week-view"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
